name: checks

# CI build + Pages deploy from main, gated on `pnpm check` — epic.md §9
# ("One-command check") and §12 criteria 1-5 (build succeeds, `pnpm check`
# passes clean, the repo is public and CI deploys from main, the live URL
# returns 200 with no asset 404s). Adapted from the course-default workflow
# (E:\comp8020\comp4020-ass1-hadissuryaalamin\.github\workflows\checks.yml)
# with one structural difference: this repo is a GitHub *user* site
# (hadissuryaalamin.github.io, epic.md §9), served at the bare root, so
# there is no repo-name sub-path to account for anywhere below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The activity feed (src/lib/github.ts) is fetched at BUILD time, so it only
  # refreshes when the site rebuilds. Without this, a commit pushed to some
  # other repo would not reach the feed until the next push to *this* one.
  #
  # 20:00 UTC is 06:00 Canberra (AEST, UTC+10). A scheduled run skips the
  # `check` job and goes straight to build+deploy — see the deploy job's
  # condition below for why that is safe and what it buys.
  #
  # NOTE: GitHub disables scheduled workflows after 60 days with no repository
  # activity. If this site goes quiet for two months the feed silently stops
  # refreshing, and the schedule has to be re-enabled by hand in the Actions
  # tab.
  schedule:
    - cron: '0 20 * * *'

# Allow the deploy job to publish to GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Jobs only run once the repo is public (epic.md §9 confirms it is, and
    # §15 item 5 asks it stay that way at launch): private-phase pushes would
    # drain the org's shared free Actions pool, and `pnpm check` runs the
    # same checks locally while building anyway.
    #
    # Scheduled runs skip this job. A cron rebuild exists only to refresh the
    # feed's data — the committed source is byte-identical to the last push,
    # which already passed the full suite. Re-running Playwright and the
    # network-dependent link checks 365 times a year to prove that again would
    # burn runner time and add a daily chance of a flake blocking the deploy.
    if: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests/**/*.spec.ts (Playwright) run as part of `pnpm check`'s test
      # step, so the browser binary has to exist before that step runs.
      - name: Install Playwright's Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck, build, lint, and run the full spec (criteria 1-2, 6-51)
        run: pnpm check
        env:
          # Raises the feed's GitHub search quota from 10/min to 30/min. Its
          # absence only degrades the feed to notes; it never fails a build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    # Pages can't serve a private repo on the free org anyway; the visibility
    # condition keeps a private-phase run from failing confusingly here.
    #
    # `always()` is required because `needs: check` otherwise skips this job
    # whenever check is skipped, which is exactly what a scheduled run does.
    # The explicit failure/cancellation guards put back what `needs` normally
    # gives us: a genuinely broken push still never reaches production.
    if: >-
      ${{ always()
          && !github.event.repository.private
          && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
          && needs.check.result != 'failure'
          && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The feed's data is fetched here, at build time. See the check job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Verify the deployed site is online (criterion 3)
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then echo "online: $url"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
      - name: Check the live site for broken links/assets (criterion 4)
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          pnpm dlx linkinator "$url" --recurse --silent
